# Check the code, run the tests, build the style study, and check the work.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, style study, and playability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the Python environment
        run: uv sync --locked

      - name: Check the code style
        run: make lint

      - name: Run the tests
        run: make test

      - name: Build the style study
        run: make study

      - name: Make sure that the committed report is current
        run: git diff --exit-code -- docs/style-study.md

      # The check needs no sound files: it reads the written music only.
      - name: Check that each player can play the work
        run: uv run gtypestar check

      - name: Upload the style study
        uses: actions/upload-artifact@v7
        with:
          name: style-study
          path: |
            docs/style-study.md
            research/measured/
            research/tables/
            research/sources.csv
          if-no-files-found: error
